version: 0.1
workflow: writer.section_generation
workflowVersion: 2026.08.poc

provider:
  routingPolicy: balanced
  preferred: gemini
  fallback:
    - bedrock

guides:
  architecture: guides/architecture.md
  writer: guides/writer-rules.md
  security: guides/security-policy.md
  evidence: guides/evidence-policy.md

contracts:
  input: contracts/writer-request.schema.json
  output: contracts/writer-response.schema.json
  evidenceChunk: contracts/evidence-chunk.schema.json
  sensorResult: contracts/sensor-result.schema.json
  runTrace: contracts/run-trace.schema.json

sensors:
  required:
    - schema-check
    - citation-check
    - groundedness-check
    - policy-check
  advisory:
    - cost-latency-check

failurePolicy: policies/failure-policy.yaml
humanReviewPolicy: policies/human-review.yaml

limits:
  maxAttempts: 3
  maxLatencyMs: 15000
  maxEstimatedCostUsd: 0.08

observability:
  capture:
    - provider
    - model
    - attempts
    - latency
    - estimatedCost
    - tokenUsage
    - guideVersions
    - sensorResults
    - evidenceIds
    - finalDecision

evaluation:
  mode: offline_docx_comparison
  scoringConfig: scoring/scoring.config.ts
  defaultInput:
    reference: eval-input/reference.docx
    generated: eval-input/generated.docx
  reports:
    json: reports/latest.json
    markdown: reports/latest.md

workflows:
  sopComplianceQc:
    provider:
      preferred: gemini
    guides:
      ruleGeneration: guides/sop-rule-generation.md
      qc: guides/sop-compliance-qc.md
    ruleGeneration:
      groundednessThreshold: 0.85
    qc:
      groundednessThreshold: 0.85
    approval:
      required: true
    retrieval:
      strategy: simple
    limits:
      maxRulesPerQcRequest: 10
      maxTargetBlocksPerQcRequest: 120
      maxEvidenceBlocksPerDocumentPerQcRequest: 80
      maxCharsPerContextDocument: 30000
      maxAttempts: 2
    output:
      clientReport: true
      oldQcAdapter: true
      trace: true
